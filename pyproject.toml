[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield"
version = "0.1.0"
description = "Evidence-linked verification of documented UAE scam patterns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
scamshield = "scamshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamshield = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
