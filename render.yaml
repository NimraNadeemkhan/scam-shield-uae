# Render Blueprint: one free web service that serves both the API and the website.
services:
  - type: web
    name: scam-shield-uae
    runtime: python
    plan: free
    buildCommand: pip install ".[api]"
    startCommand: uvicorn scamshield.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
